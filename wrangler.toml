name = "ionlab-refinery"
main = "worker/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

# Next.js 정적 빌드 에셋 바인딩
[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 1. Cloudflare D1 Database 바인딩
[[d1_databases]]
binding = "DB"
database_name = "ionlab-refinery"
database_id = "a7190752-926e-43e1-b7b8-f91f80a5fb23"

# 2. Cloudflare R2 Object Storage 바인딩
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "ionlab-refinery-img"

# 3. 환경 변수
[vars]
R2_PUBLIC_ENDPOINT = "https://50ae1037c217963ee7964fb37487644c.r2.cloudflarestorage.com/ionlab-refinery-img"

# 4. 관찰 가능성 및 실시간 로그 (Observability & Logs)
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
